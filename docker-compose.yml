# Local stack: the app built from source plus a lean Postgres, Valkey and the worker. Values come from .env.
# Only Postgres and Valkey: `docker compose up -d postgres valkey` (for `npm run dev`).
name: roadmap-v2

services:
  app:
    build: .
    image: roadmap-app:local
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://roadmap:${POSTGRES_PASSWORD:-roadmap}@postgres:5432/roadmap
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${APP_PORT:-3000}}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      VALKEY_URL: redis://valkey:6379
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      EVENT_UPLOADS_DIR: ${EVENT_UPLOADS_DIR:-/data/uploads}
    volumes:
      - roadmap-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

  worker:
    image: roadmap-app:local
    command: ["node", "worker/worker.mjs"]
    environment:
      DATABASE_URL: postgres://roadmap:${POSTGRES_PASSWORD:-roadmap}@postgres:5432/roadmap
      VALKEY_URL: redis://valkey:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      EVENT_UPLOADS_DIR: ${EVENT_UPLOADS_DIR:-/data/uploads}
    volumes:
      - roadmap-uploads:/data/uploads
    depends_on:
      app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "worker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s
    mem_limit: 256m
    restart: unless-stopped
    profiles: ["app"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roadmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadmap}
      POSTGRES_DB: roadmap
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - roadmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - roadmap-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped

volumes:
  roadmap-db:
  roadmap-valkey:
  roadmap-uploads:
