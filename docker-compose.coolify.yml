# Deployment on Coolify from the GHCR image built by .github/workflows/image.yml.
# In Coolify: New Resource -> Docker Compose -> this file. Set BETTER_AUTH_URL (the
# public https URL, e.g. https://roadmap.example.com), BETTER_AUTH_SECRET,
# DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and ENCRYPTION_KEY (openssl rand -base64 32),
# and assign the same domain to the "app" service on port 3000. The stack is app,
# worker (background jobs), Postgres and Valkey; only "app" gets a domain. The database
# and Valkey passwords (SERVICE_PASSWORD_POSTGRES, SERVICE_PASSWORD_VALKEY) are generated by Coolify. BETTER_AUTH_URL is set by hand because
# Better Auth only accepts sign-ins from exactly that origin, and a domain saved as http://
# would reject https requests. Optionally set METRICS_TOKEN to enable /api/metrics, and
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT to enable Web Push.
# Register <BETTER_AUTH_URL>/api/auth/callback/discord as a redirect in the Discord application.
name: roadmap-v2

services:
  app:
    image: ghcr.io/slne-development/roadmap-app:latest
    environment:
      - SERVICE_FQDN_APP_3000
      - DATABASE_URL=postgres://roadmap:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/roadmap
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?Set DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?Set DISCORD_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - VALKEY_URL=redis://default:${SERVICE_PASSWORD_VALKEY}@valkey:6379
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - EVENT_UPLOADS_DIR=${EVENT_UPLOADS_DIR:-/data/uploads}
    volumes:
      - roadmap-uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ghcr.io/slne-development/roadmap-app:latest
    command: ["node", "worker/worker.mjs"]
    environment:
      - DATABASE_URL=postgres://roadmap:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/roadmap
      - VALKEY_URL=redis://default:${SERVICE_PASSWORD_VALKEY}@valkey:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - EVENT_UPLOADS_DIR=${EVENT_UPLOADS_DIR:-/data/uploads}
    volumes:
      - roadmap-uploads:/data/uploads
    depends_on:
      app:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "worker/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 40s
    mem_limit: 256m
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=roadmap
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=roadmap
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - effective_cache_size=64MB
    volumes:
      - roadmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadmap -d roadmap"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--requirepass", "${SERVICE_PASSWORD_VALKEY}"]
    environment:
      - SERVICE_PASSWORD_VALKEY
    volumes:
      - roadmap-valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$SERVICE_PASSWORD_VALKEY\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped

volumes:
  roadmap-db:
  roadmap-valkey:
  roadmap-uploads:
